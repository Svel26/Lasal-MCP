name: 🐛 Bug Report
description: Report a reproducible bug or issue with Lasal-MCP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What were you trying to do?
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP Client
      description: What MCP client are you using?
      options:
        - Claude Desktop
        - Claude Code
        - Cursor
        - Windsurf
        - Antigravity / Gemini
        - MCP Inspector
        - Other (specify in description)
    validations:
      required: true
  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution Mode
      description: How is Lasal-MCP running?
      options:
        - npx (npx -y lasal-mcp)
        - Local clone (node dist/server.js)
        - Global npm package (npm i -g lasal-mcp)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Target Environment
      description: What target environment were you targeting?
      options:
        - LARS Simulation (Local runtime)
        - Physical Sigmatek PLC Hardware
        - VISU Web Simulation (DataService)
        - Project / File / Class operations only
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions & Environment
      description: Please share relevant versions.
      value: |
        - OS: Windows 10/11
        - Node.js version: (e.g. v20.x.x)
        - Lasal-MCP version: (e.g. 0.2.0)
        - LASAL CLASS 2 version: (e.g. 2.1.x)
        - VISUDesigner version: (e.g. 1.x)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or tool call sequence to reproduce the problem.
      placeholder: |
        1. Called tool `select_project` with path '...'
        2. Called tool `...`
        3. Observed error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Output
      description: Paste any error messages, stack traces, or console output (please redact sensitive project paths or passwords).
      render: shell
